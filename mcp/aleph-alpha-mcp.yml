summary: Aleph Alpha ships Model Context Protocol support on both sides of the protocol. PhariaAssistant
  Chat has native MCP client support and BUNDLES several first-party MCP servers with the PhariaAI distribution;
  the Stateful Responses API executes MCP tools server-side in an agentic loop on the caller's behalf.
  Because PhariaAI is deployed on-premise (or as a per-customer hosted installation), these servers are
  reached at the customer's own Pharia domain — Aleph Alpha publishes no single public/remote MCP endpoint
  URL, so no anonymous tools/list introspection is possible.

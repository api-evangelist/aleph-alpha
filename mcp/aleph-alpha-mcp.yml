client_side:
  responses_api:
    description: The Responses API supports server-executed MCP tools — Stateful Responses connects to
      an MCP endpoint, executes the tool, and feeds the result back to the model in an agentic loop. The
      LLM backend never sees the tool calls directly.
    operation: post_responses_endpoint_v1_responses_post
    source_operation: openapi/aleph-alpha-responses-openapi.json#post_responses_endpoint_v1_responses_post
    docs: https://docs.aleph-alpha.com/phariaai-dev-guide/latest/responses-api/tool-calling.html
  configurable_timeouts: Configurable timeouts for MCP tool calls were added in PhariaAI v1.260300.0.

            If not provided, default is `/metrics`.'
          type: string
          example: /custom-metrics
        scrapingInterval:
          description: 'Interval which metrics should be scraped. It follows Prometheus Duration format.

            See https://prometheus.io/docs/prometheus/latest/querying/basics/#float-literals-and-time-durations for reference.

            If not provided, default is 30s.'
          type: string

apis:
- aid: aleph-alpha:pharia-inference
  name: PhariaInference API
  description: 'Access and interact with Aleph Alpha models and functionality over
    HTTP endpoints. Provides completion, chat completions, embeddings, semantic and
    batch semantic embeddings, tokenization and detokenization, model listing and
    model settings, plus API token management. Version 4.7.0 is the version currently
    served by the hosted gateway at api.aleph-alpha.com.'
  humanURL: https://docs.aleph-alpha.com/phariaai-dev-guide/latest/pharia-openapi/pharia-inference/index.html
  baseURL: https://api.aleph-alpha.com
  tags:
  - Inference
  - Completion
  - Chat
  - Embeddings
  - Tokenization
  properties:
  - type: OpenAPI
    url: openapi/aleph-alpha-pharia-inference-openapi.json
  - type: Documentation
    url: https://docs.aleph-alpha.com/phariaai-dev-guide/latest/pharia-openapi/pharia-inference/v4.7.0.html
- aid: aleph-alpha:pharia-data
  name: PhariaData API
  description: 'The PhariaData API provides a comprehensive suite of endpoints to manage
    data workflows within the Pharia Data Platform — repositories, datasets, datapoints,
    stages, files, downloads, connectors, transformations and transformation runs,
    plus search stores and document management.'
  humanURL: https://docs.aleph-alpha.com/phariaai-dev-guide/latest/pharia-openapi/pharia-data.html
  baseURL: https://api.aleph-alpha.com/v1/studio/data
  tags:
  - Data
  - Datasets
  - Repositories
  - Transformations
  - Search Store
  properties:
  - type: OpenAPI
    url: openapi/aleph-alpha-pharia-data-openapi.json
- aid: aleph-alpha:pharia-search
  name: PhariaSearch / Document Index API
  description: 'The Document Index is a service that provides semantic search over
    your knowledge base. It handles chunking and embedding of documents and keeps
    embeddings in sync, and exposes namespaces, collections, documents, indexes and
    filter indexes for hybrid semantic and keyword retrieval.'
  humanURL: https://docs.aleph-alpha.com/phariaai-dev-guide/latest/pharia-openapi/pharia-search.html
  baseURL: https://api.aleph-alpha.com/v1/studio/search
  tags:
  - Search
  - Semantic Search
  - Document Index
  - Retrieval
  - Embeddings
  properties:
  - type: OpenAPI
    url: openapi/aleph-alpha-pharia-search-openapi.json
- aid: aleph-alpha:pharia-studio
  name: PhariaStudio API
  description: 'PhariaStudio is the collaborative development environment for building,
    debugging, evaluating and deploying organisation-specific AI solutions. Its API
    covers projects, traces, spans and events, evaluation datasets, benchmarks and
    benchmark executions, lineages, workspaces and model access.'
  humanURL: https://docs.aleph-alpha.com/phariaai-dev-guide/latest/pharia-openapi/pharia-studio.html
  baseURL: https://api.aleph-alpha.com/v1/studio
  tags:
  - Studio
  - Evaluation
  - Tracing
  - Observability
  - Benchmarks
  properties:
  - type: OpenAPI
    url: openapi/aleph-alpha-pharia-studio-openapi.json
- aid: aleph-alpha:pharia-os
  name: PhariaOS Manager API
  description: 'PhariaOS is a resource management system that oversees the entire lifecycle
    of AI resources, from inception to maintenance. The Manager API covers cluster
    GPUs, nodes and taints, use cases and deployments, foundation models, inference
    runtimes and model registration. Published as a Swagger 2.0 definition.'
  humanURL: https://docs.aleph-alpha.com/phariaai-dev-guide/latest/pharia-openapi/pharia-os.html
  baseURL: https://api.aleph-alpha.com/v1/os
  tags:
  - Operations
  - Kubernetes
  - Deployments
  - Model Management
  - GPU
  properties:
  - type: OpenAPI
    url: openapi/aleph-alpha-pharia-os-openapi.json
- aid: aleph-alpha:responses
  name: Responses API (Stateful Responses)
  description: 'A stateful, OpenAI-compatible Responses API for building agentic applications
    on PhariaAI. Supports conversations, response persistence and retrieval, guardrail
    checks, client-executed function tools and server-executed MCP (Model Context Protocol)
    tools that the service invokes in an agentic loop on the caller''s behalf.'
  humanURL: https://docs.aleph-alpha.com/phariaai-dev-guide/latest/responses-api/index.html
  baseURL: https://api.aleph-alpha.com
  tags:
  - Responses
  - Conversations
  - Agents
  - Tool Calling
  - Guardrails
  properties:
  - type: OpenAPI
    url: openapi/aleph-alpha-responses-openapi.json
  - type: Documentation
    url: https://docs.aleph-alpha.com/phariaai-dev-guide/latest/responses-api/index.html

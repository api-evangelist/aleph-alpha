- aid: aleph-alpha:aleph-alpha-transformations-api
  name: Aleph Alpha Transformations API
  description: >-
    Available transformations can be applied to an input data object of type A to produce an output data
    object of type B. The output data object will consist of a sequence of items, each of which will conform
    to an Avro schema specified in the transformation as OutputSchema. Currently, the input data object
    can be a File located in a Stage within the Data Platform. Future versions will support receiving
    Datasets from Repositories in the Data Platform as input data objects. The output data object can
    be loaded into various types of data storage within the Data Platform, with Repositories being the
    first supported storage type. When triggering a transformation, this has to be specified as destination.
    After loading the output into the destination, it can also be sent to an external service through
    available connectors in the Data Platform. The first available connector will be the Document Index
    Collection Connector.
  humanURL: >-

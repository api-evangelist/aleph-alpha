aid: aleph-alpha
name: Aleph Alpha
description: 'Aleph Alpha is a Heidelberg, Germany based sovereign AI company building
  PhariaAI, an end-to-end, customizable AI suite for enterprises and governments that
  can be deployed on-premise or hosted. The stack combines leading open-source and
  proprietary large language models with Aleph Alpha''s own Pharia-1-LLM model family
  and its research into transparency, explainability and domain-specific performance.
  PhariaAI is exposed through six documented HTTP APIs — PhariaInference (completion,
  chat, embeddings, tokenization), PhariaData (repositories, datasets, transformations),
  PhariaSearch / Document Index (semantic search over a knowledge base), PhariaStudio
  (projects, traces, evaluation, benchmarks), PhariaOS (cluster, use case and model
  lifecycle management) and a stateful, OpenAI-compatible Responses API with MCP tool
  calling — each published as an OpenAPI or Swagger definition on the Aleph Alpha documentation
  site. First-party SDKs ship for Python and Rust, alongside a CLI for publishing WebAssembly
  skills to the Pharia Kernel.'

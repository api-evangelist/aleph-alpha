- aid: aleph-alpha:aleph-alpha-stages-api
  name: Aleph Alpha Stages API
  description: >-
    Stages serve as the data platform's entry point for data collection, where source files are securely
    stored, enabling subsequent transformations and dataset generation. Files can be uploaded directly
    into stages via the HTTP API or through connectors, which support automated and continuous synchronization
    with your source systems. Stages provide secure, persistent storage and act as an interface for importing
    and exporting data files within the platform. To improve data discoverability, comprehension, and
    quality for end users, the data platform offers datasets as the recommended abstraction for organizing
    and sharing data.

summary: 'Aleph Alpha publishes no public test/live key separation, no magic test identifiers and
  no fixture tooling — PhariaAI is deployed per customer, so there is no shared sandbox tenant.
  What it does publish is an interactive console (the PhariaStudio Playground) and a documented
  local development loop for custom applications and skills.'
